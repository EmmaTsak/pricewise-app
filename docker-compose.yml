version: "3.9"

services:
  database:
    image: postgres:16
    container_name: pricewise-database
    restart: unless-stopped
    env_file:
      - ./client-api/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pricewise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricewise_password}
      POSTGRES_DB: ${POSTGRES_DB:-pricewise}
    volumes:
      - pricewise_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build:
      context: ./client-api
    container_name: pricewise-backend
    restart: unless-stopped
    depends_on:
      - database
    env_file:
      - ./client-api/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000
    container_name: pricewise-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pricewise_postgres_data: